# This is a reusable workflow, rather than an action.

name: Create branch sync PR
description: |
  Merge bug fixes from older release branches into newer releases,
  bubbling them up until they reach master.

on:
  workflow_call:
    inputs:
      head_branch:
        description: Branch containing changes to create the sync PR from.
        type: string
        required: false
        default: ""
      ignore_branches:
        description: Regular expression pattern matching branches to skip creating sync PRs from.
        type: string
        required: false
        default: ""

concurrency:
  group: sync-${{ inputs.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull_requests: write
    steps:
      - name: Configure git
        uses: $/configure-git

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      # Use a custom action so we can have the logic in a script file.
      - name: Create sync PR
        uses: $/create-sync-pr
        with:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          STATUS_JSON: https://raw.githubusercontent.com/cylc/cylc-admin/master/docs/status/branches.json
          IGNORE_BRANCHES: ${{ inputs.ignore_branches }}
