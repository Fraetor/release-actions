name: Build Python package
description: |
  Build Python package wheel distribution.
  Must be run in the (usually top-level) package dir containing pyproject.toml.

inputs:
  check-dependencies:
    description: Try pip-installing dependencies to make sure we are pinned to released versions on PyPI.
    required: false
    default: true
  optional-deps:
    description: Specify optional dependencies to install e.g, `[foo,bar]`.
    default: '[all]'

runs:
  using: composite
  steps:
    - name: Build
      shell: bash -leo pipefail {0}
      env:
        PIP_PROGRESS_BAR: off
      run: |
        python3 --version

        echo "::group::Installing build dependencies"
        python3 -m pip install build twine
        echo "::endgroup::"

        echo "::group::Building sdist and wheel"
        python3 -m build
        echo "::endgroup::"

    - name: Check build artifacts
      shell: bash -leo pipefail {0}
      run: |
        twine check dist/*

    - name: Check dependencies
      if: inputs.check-dependencies == 'true'
      # ^ string comparison needed due to https://github.com/actions/runner/issues/2238
      shell: bash -leo pipefail {0}
      env:
        DEP_GROUP: ${{ inputs.optional-deps }}
      run: |
        python3 -m pip install -e ".${DEP_GROUP}" --dry-run --ignore-installed
