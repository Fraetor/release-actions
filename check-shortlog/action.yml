name: Check Shortlog
description: |
  Check the output of git shortlog -s matches the list of contributors in the
  CONTRIBUTING.md file.

inputs:
  contributing_file:
    description: Path to contributing file.
    default: CONTRIBUTING.md
    required: false

runs:
  using: composite
  steps:
    - name: Get known contributors from contributing file
      shell: bash
      env:
        CONTRIBUTING_FILE: ${{ inputs.contributing_file }}
      run: |
        sed \
            -n \
            -e 's/ - //' \
            -e 's/ (.*)//' \
            -e 's/^(//' -e 's/)$//' \
            -e '/start-shortlog/,${p;/end-shortlog/q}' \
            "${CONTRIBUTING_FILE}" \
            | head -n -1 \
            | tail -n +2 \
            | sort \
            > contributors
        echo '::group::Contributors from contributing file:'
        cat contributors
        echo "::endgroup::"

    - name: List commit authors
      shell: bash
      run: |
        git shortlog -s HEAD \
            | awk '{$1=""; print substr($0,2) }' \
            | sort \
            | grep -vF '[bot]' \
            > shortlog
        echo '::group::Commit authors:'
        git shortlog -se HEAD
        echo '::endgroup::'

    - name: See if they differ
      shell: bash
      env:
        CONTRIBUTING_FILE: ${{ inputs.contributing_file }}
      run: |
        if ! diff -u shortlog contributors
        then
            echo "::error::${CONTRIBUTING_FILE} or .mailmap needs updating; \
            if you have not added yourself to this file please do so. \
            If you need to register a second email address or change the appearance of your name, \
            add an entry to the .mailmap file (https://git-scm.com/docs/gitmailmap)."
            false
        fi
